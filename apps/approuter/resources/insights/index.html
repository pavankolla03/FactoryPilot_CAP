<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FactoryPilot — Insights</title>
<style>
  :root {
    --bg: #f5f6f7;
    --surface: #ffffff;
    --border: #d9d9d9;
    --text: #1d2d3e;
    --muted: #5b738b;
    --accent: #0a6ed1;
    --accent-dark: #0854a0;
    --good: #107e3e;
    --warn: #e9730c;
    --bad: #bb0000;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c2228; --surface: #23292f; --border: #3a4552;
      --text: #eaecee; --muted: #a9b4bf; --accent: #4db1ff; --accent-dark: #7cc4ff;
      --good: #4db678; --warn: #f5a623; --bad: #ff5c5c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "72", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  main { max-width: 860px; margin: 0 auto; padding: 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 320px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    background: transparent; color: var(--accent); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 400;
  }
  .chip:hover { background: var(--bg); }
  .summary { font-size: 17px; margin: 0 0 14px; }
  .metrics { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .metric {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; min-width: 96px;
  }
  .metric .n { font-size: 22px; font-weight: 600; }
  .metric .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .badge.hit { color: var(--good); border-color: var(--good); }
  .badge.miss { color: var(--muted); }
  .badge.denied { color: var(--bad); border-color: var(--bad); }
  .alert { border-left: 4px solid var(--warn); }
  .alert.error { border-left-color: var(--bad); }
  .alert h2 { font-size: 15px; margin: 0 0 6px; }
  .alert p { margin: 0; color: var(--muted); }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .hidden { display: none; }
  .spinner {
    width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 7px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 20px 28px; }
</style>
</head>
<body>
<header>
  <h1>FactoryPilot</h1>
  <span class="sub">S/4HANA Insights</span>
  <span class="spacer"></span>
  <span class="sub" id="usage">&nbsp;</span>
</header>

<main>
  <section class="card">
    <div class="row">
      <div class="grow">
        <label for="q">Ask about your operational data</label>
        <input id="q" type="text" autocomplete="off"
               placeholder="How many deliveries today in my warehouse?" />
      </div>
      <div style="flex:0 0 130px">
        <label for="wh">Shipping point</label>
        <select id="wh">
          <option value="1000">1000</option>
          <option value="1010">1010</option>
          <option value="2000">2000</option>
        </select>
      </div>
      <div style="flex:0 0 130px">
        <label for="when">Period</label>
        <select id="when">
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="tomorrow">Tomorrow</option>
        </select>
      </div>
      <div style="flex:0 0 auto; align-self:flex-end">
        <button id="ask">Ask</button>
      </div>
    </div>
    <div class="chips">
      <button class="chip" data-q="How many deliveries today in my warehouse?">Deliveries today</button>
      <button class="chip" data-q="How many outbound deliveries are still to be shipped?">Still to ship</button>
      <button class="chip" data-q="How many sales orders do we have?">Sales orders</button>
      <button class="chip" data-q="What is the weather in Berlin?">Unmatched question</button>
    </div>
  </section>

  <section id="result" class="card hidden"></section>
</main>

<footer id="foot"></footer>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const qEl = $("q"), whEl = $("wh"), whenEl = $("when"), askEl = $("ask"), outEl = $("result");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));

  function show(html, cls = "") {
    outEl.className = "card " + cls;
    outEl.innerHTML = html;
    outEl.classList.remove("hidden");
  }

  function renderBadges(meta) {
    const cache = (meta.cacheResult || "").toLowerCase();
    const rate = (meta.rateLimitResult || "").toLowerCase();
    const bits = [
      `<span class="badge">${esc(meta.objectCode || "—")}</span>`,
      `<span class="badge ${cache === "hit" ? "hit" : "miss"}">cache ${esc(meta.cacheResult || "n/a")}</span>`,
      `<span class="badge ${rate === "denied" ? "denied" : ""}">quota ${esc(meta.rateLimitResult || "n/a")}</span>`,
      `<span class="badge">${esc(meta.rowCount ?? 0)} rows</span>`,
      `<span class="badge">${esc(meta.tokensUsed ?? 0)} tokens</span>`,
      `<span class="badge">${esc(meta.totalResponseTimeMs ?? 0)} ms</span>`,
    ];
    if (meta.intentMethod) bits.push(`<span class="badge">intent: ${esc(meta.intentMethod)}</span>`);
    return `<div class="badges">${bits.join("")}</div>`;
  }

  function renderAnswer(body) {
    const m = body.metrics || {};
    const metrics = Object.entries(m).map(([k, v]) =>
      `<div class="metric"><div class="n">${esc(v)}</div><div class="k">${esc(k)}</div></div>`
    ).join("");

    const tables = (body.breakdowns || []).filter(b => (b.items || []).length).map((b) => `
      <table>
        <thead><tr><th>${esc(b.key || "Breakdown")}</th><th>Count</th></tr></thead>
        <tbody>${(b.items || []).map((i) =>
          `<tr><td>${esc(i.name)}</td><td>${esc(i.count)}</td></tr>`).join("")}</tbody>
      </table>`).join("");

    show(`<p class="summary">${esc(body.summaryText)}</p>
          <div class="metrics">${metrics}</div>
          ${tables}
          ${renderBadges(body.metadata || {})}`);
  }

  function renderProblem(status, body) {
    const meta = body.metadata || {};
    if (status === 429) {
      const when = body.retryAfterEpoch
        ? new Date(body.retryAfterEpoch * 1000).toLocaleString()
        : "the next reset window";
      show(`<div><h2>Quota reached</h2>
            <p>${esc(body.message || "Rate limit exceeded.")} Your
            ${esc((body.exceededWindow || "day").toLowerCase())} limit resets at ${esc(when)}.</p></div>
            ${renderBadges(meta)}`, "card alert");
      return;
    }
    show(`<div><h2>${status === 400 ? "Could not answer that" : "Upstream problem"}</h2>
          <p>${esc(body.message || "Unexpected error.")}
          ${body.errorCode ? ` <code>${esc(body.errorCode)}</code>` : ""}</p></div>
          ${renderBadges(meta)}`, "card alert error");
  }

  async function refreshUsage() {
    try {
      const res = await fetch("insights/usage/me");
      if (!res.ok) return;
      const u = await res.json();
      const limit = u.limits?.day;
      $("usage").textContent = limit == null
        ? `${u.userId}`
        : `${u.userId} — ${u.used?.day ?? 0}/${limit} today`;
    } catch { /* usage is decoration; never block the page on it */ }
  }

  async function ask() {
    const question = qEl.value.trim();
    if (!question) { qEl.focus(); return; }

    askEl.disabled = true;
    askEl.innerHTML = '<span class="spinner"></span>Asking';
    show('<p class="summary">Resolving intent, checking quota, querying S/4…</p>');

    try {
      const res = await fetch("insights/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          questionText: question,
          filters: { datePreset: whenEl.value, warehouse: whEl.value },
          channel: "Web",
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok) renderAnswer(body); else renderProblem(res.status, body);
    } catch (err) {
      show(`<div><h2>Cannot reach the orchestrator</h2>
            <p>${esc(err.message)}. Is the service running on this origin?</p></div>`,
           "card alert error");
    } finally {
      askEl.disabled = false;
      askEl.textContent = "Ask";
      refreshUsage();
    }
  }

  askEl.addEventListener("click", ask);
  qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  document.querySelectorAll(".chip").forEach((c) =>
    c.addEventListener("click", () => { qEl.value = c.dataset.q; ask(); }));

  $("foot").textContent = "Answers come from live S/4HANA OData via the configured business object registry.";
  refreshUsage();
})();
</script>
</body>
</html>
