<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IntelliOps4 — Insights</title>
<link rel="icon" href="../shared/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../shared/fiori.css" />
<link rel="stylesheet" href="assets/chat.css" />
<!-- Synchronous and before the stylesheets take effect: a deferred script runs
     after the page has already been painted in the system theme, and someone
     who chose light on a dark machine sees it flash dark on every navigation.
     Also builds the theme selector, so every page gets the same control. -->
<script src="../shared/theme.js"></script>
</head>
<body>

<div class="fd-shellbar">
  <span class="fd-shellbar__logo" aria-hidden="true">
    <svg viewBox="2.5 1.9 57.7 57.7"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M53.79 38.4 A21.5 21.5 0 0 1 25.94 49.93 L15 53 L17.06 43.24 A21.5 21.5 0 1 1 55.42 31.87" stroke-width="4.6"/><path d="M6.5 22 V42" stroke-width="6"/><circle cx="25.5" cy="34" r="6.3" stroke-width="4"/><path d="M48 15 L40 35 H57" stroke-width="4.4"/><path d="M48 15 V46" stroke-width="4.4"/><path class="io-accent-s" d="M29.95 29.55 L36.5 21.5" stroke-width="3.2" stroke="#3B9AF8"/></g><circle class="io-accent-f" cx="38" cy="20" r="3.3" fill="#3B9AF8"/><circle class="io-accent-f" cx="25.5" cy="34" r="2.6" fill="#3B9AF8"/></svg>
  </span>
  <span class="fd-shellbar__title">Intelli<span class="io-accent">Ops4</span></span>
  <span class="fd-shellbar__subtitle">Insights</span>
  <span class="fd-shellbar__spacer"></span>
  <nav class="fd-shellbar__nav">
    <a href="index.html" class="is-active">Insights</a>
    <a href="../admin/index.html">Admin</a>
    <a href="../dashboard/index.html">Monitoring</a>
  </nav>
  <label class="shell-wh">
    <span class="shell-wh__label">Plant</span>
    <select id="wh" aria-label="Plant / warehouse">
      <option value="1010">1010</option>
      <option value="1710">1710</option>
      <option value="1000">1000</option>
    </select>
  </label>
  <span class="fd-shellbar__avatar" id="initials">?</span>
  <span class="fd-shellbar__user" id="usage"></span>
</div>

<div class="layout">

  <!-- previous sessions -------------------------------------------------- -->
  <aside class="sessions">
    <div class="sessions__head">
      <button class="sessions__new" id="newchat">＋&nbsp; New chat</button>
    </div>
    <div class="sessions__find">
      <input id="search" type="search" placeholder="Search chats" aria-label="Search conversations" />
    </div>
    <div class="sessions__list" id="sessionlist"><p class="sessions__empty">Loading…</p></div>
  </aside>

  <!-- the conversation --------------------------------------------------- -->
  <main class="chat">
    <div class="thread" id="thread"></div>

    <div class="composer">
      <div class="composer__attachment" id="attachment" hidden></div>
      <div class="composer__box">
        <textarea id="q" rows="1"
          placeholder="Ask about stock, goods movements, inventory counts, deliveries or purchase orders…"
          aria-label="Your question"></textarea>
        <div class="composer__tools">
          <button id="mic" class="composer__tool" type="button" aria-label="Dictate your question" title="Dictate">🎤</button>
          <button id="clip" class="composer__tool" type="button" aria-label="Attach a file" title="Attach a CSV, JSON or text file">📎</button>
          <button id="cam" class="composer__tool" type="button" aria-label="Take a photo" title="Photograph a label or document">📷</button>
          <input id="file" type="file" hidden accept=".csv,.txt,.json,.md,.log,text/*,application/json" />
          <input id="photo" type="file" hidden accept="image/*" capture="environment" />
        </div>
        <button id="ask" class="composer__send" aria-label="Send question">↑</button>
      </div>
      <p class="composer__note">
        Answers come from live S/4HANA data via the registered business objects.
        Writes always require your confirmation.
      </p>
    </div>
  </main>
</div>

<script src="assets/chat.js" defer></script>
</body>
</html>
