<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FactoryPilot — Insights</title>
<link rel="stylesheet" href="../shared/fiori.css" />
<link rel="stylesheet" href="assets/chat.css" />
</head>
<body>

<div class="fd-shellbar">
  <span class="fd-shellbar__logo">FP</span>
  <span class="fd-shellbar__title">FactoryPilot</span>
  <span class="fd-shellbar__subtitle">Insights</span>
  <span class="fd-shellbar__spacer"></span>
  <nav class="fd-shellbar__nav">
    <a href="index.html" class="is-active">Insights</a>
    <a href="../admin/index.html">Admin</a>
    <a href="../dashboard/index.html">Monitoring</a>
  </nav>
  <span class="fd-shellbar__avatar" id="initials">?</span>
  <span class="fd-shellbar__user" id="usage"></span>
</div>

<div class="layout">

  <!-- previous sessions -------------------------------------------------- -->
  <aside class="sessions">
    <div class="sessions__head">
      <button class="sessions__new" id="newchat">＋&nbsp; New chat</button>
    </div>
    <div class="sessions__find">
      <input id="search" type="search" placeholder="Search chats" aria-label="Search conversations" />
    </div>
    <div class="sessions__list" id="sessionlist"><p class="sessions__empty">Loading…</p></div>
  </aside>

  <!-- the conversation --------------------------------------------------- -->
  <main class="chat">
    <div class="thread" id="thread"></div>

    <div class="composer">
      <div class="composer__box">
        <select id="wh" class="composer__wh" aria-label="Plant">
          <option value="1010">Plant 1010</option>
          <option value="1710">Plant 1710</option>
          <option value="1000">Plant 1000</option>
        </select>
        <textarea id="q" rows="1"
          placeholder="Ask about stock, goods movements, inventory counts, deliveries or purchase orders…"
          aria-label="Your question"></textarea>
        <button id="ask" class="composer__send" aria-label="Send question">↑</button>
      </div>
      <p class="composer__note">
        Answers come from live S/4HANA data via the registered business objects.
        Writes always require your confirmation.
      </p>
    </div>
  </main>
</div>

<script src="assets/chat.js" defer></script>
</body>
</html>
