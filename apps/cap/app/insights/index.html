<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FactoryPilot — Insights</title>
<link rel="stylesheet" href="../shared/fiori.css" />
<style>
  .turn { margin-bottom: 0.75rem; }
  .turn__role {
    font-size: 0.75rem; color: var(--sapContentLabelColor);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 0.25rem;
  }
  .turn__body { font-size: 0.9375rem; }
  .turn--me .fd-card { border-style: dashed; box-shadow: none; background: transparent; }
  .badges { display: flex; gap: 0.375rem; flex-wrap: wrap; margin-top: 0.75rem; }
  .metrics { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0 0; }
  .metric {
    background: var(--sapBackgroundColor); border: 1px solid var(--sapList_BorderColor);
    border-radius: 0.25rem; padding: 0.5rem 0.75rem; min-width: 5rem;
  }
  .metric__n { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric__k { font-size: 0.6875rem; color: var(--sapContentLabelColor); text-transform: uppercase; letter-spacing: .03em; }
  .approve { border-left: 0.25rem solid var(--sapCriticalColor); }
  .approve--anomalous { border-left-color: var(--sapNegativeColor); }
  .approve dl { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; margin: 0.75rem 0; font-size: 0.875rem; }
  .approve dt { color: var(--sapContentLabelColor); }
  .approve dd { margin: 0; font-variant-numeric: tabular-nums; }
  .suggest { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
  .suggest button { font-size: 0.8125rem; border-radius: 1rem; padding: 0.3125rem 0.75rem; }
</style>
</head>
<body>

<div class="fd-shellbar">
  <span class="fd-shellbar__logo">FP</span>
  <span class="fd-shellbar__title">FactoryPilot</span>
  <span class="fd-shellbar__subtitle">Insights</span>
  <span class="fd-shellbar__spacer"></span>
  <nav class="fd-shellbar__nav">
    <a href="../insights/" aria-current="page">Insights</a>
    <a href="../admin/">Admin</a>
    <a href="../dashboard/">Monitoring</a>
  </nav>
  <span class="fd-shellbar__user"><span class="fd-avatar" id="initials">–</span><span id="usage"></span></span>
</div>

<main class="fd-page fd-page--narrow">

  <section class="fd-card">
    <div class="fd-card__content">
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-end">
        <div style="flex:1 1 20rem">
          <label class="fd-label" for="q">Ask about your operational data</label>
          <input class="fd-input" id="q" type="text" autocomplete="off"
                 placeholder="How many deliveries today in my warehouse?" />
        </div>
        <div style="flex:0 0 8rem">
          <label class="fd-label" for="wh">Warehouse</label>
          <select class="fd-select" id="wh"><option>1000</option><option>1010</option><option>2000</option></select>
        </div>
        <button class="fd-button" id="ask">Ask</button>
      </div>
      <div class="suggest">
        <button class="fd-button fd-button--transparent" data-q="How many deliveries today in warehouse 1000?">Deliveries today</button>
        <button class="fd-button fd-button--transparent" data-q="How much stock do we have?">Material stock</button>
        <button class="fd-button fd-button--transparent" data-q="Move 250 units of P123 from packing to shipping in warehouse 1000">Move stock</button>
        <button class="fd-button fd-button--transparent" data-q="What is the weather in Berlin?">Unmatched question</button>
      </div>
    </div>
  </section>

  <div id="thread"></div>
</main>

<footer class="fd-footer">Answers come from live S/4HANA data via the registered business objects. Writes always require confirmation.</footer>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const qEl = $("q"), whEl = $("wh"), askEl = $("ask"), thread = $("thread");
  let conversationID = null;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  function add(html, cls = "") {
    const el = document.createElement("section");
    el.className = "fd-card " + cls;
    el.style.marginBottom = "0.75rem";
    el.innerHTML = html;
    thread.prepend(el);
    return el;
  }

  /** Fiori object status — semantic colour carries the meaning, not decoration. */
  function badges(m = {}) {
    const bits = [];
    if (m.objectCode) bits.push(`<span class="fd-status fd-status--information">${esc(m.objectCode)}</span>`);
    if (m.toolsCalled) bits.push(`<span class="fd-status">${esc(m.toolsCalled)}</span>`);
    bits.push(`<span class="fd-status ${m.grounded ? "fd-status--positive" : "fd-status--critical"}">${
      m.grounded ? "Grounded in data" : "Not grounded"}</span>`);
    if (m.quotaResult) bits.push(`<span class="fd-status ${m.quotaResult === "DENIED" ? "fd-status--negative" : ""}">Quota ${esc(m.quotaResult)}</span>`);
    if (m.cacheResult && m.cacheResult !== "NOT_APPLICABLE") {
      bits.push(`<span class="fd-status ${m.cacheResult === "HIT" ? "fd-status--positive" : ""}">Cache ${esc(m.cacheResult)}</span>`);
    }
    if (m.rounds != null) bits.push(`<span class="fd-status">${esc(m.rounds)} rounds</span>`);
    bits.push(`<span class="fd-status">${esc(m.tokensUsed ?? 0)} tokens</span>`);
    bits.push(`<span class="fd-status">${esc(m.totalResponseTimeMs ?? 0)} ms</span>`);
    return `<div class="badges">${bits.join("")}</div>`;
  }

  function renderApproval(p, meta) {
    const args = (() => { try { return JSON.parse(p.arguments || "{}"); } catch { return {}; } })();
    const rows = Object.entries(args).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
    const el = add(`
      <div class="fd-card__header">
        <h3 class="fd-card__title">Confirmation required</h3>
        <p class="fd-card__subtitle">${esc(p.summary)}</p>
      </div>
      <div class="fd-card__content">
        ${p.anomalous ? `<div class="fd-message-strip fd-message-strip--error" style="margin-bottom:0.75rem">
          <span><span class="fd-message-strip__title">Anomaly.</span> ${esc(p.anomalyReason)}</span></div>` : ""}
        <dl>${rows}</dl>
        <div style="display:flex;gap:0.5rem">
          <button class="fd-button" data-act="approve">Approve and run</button>
          <button class="fd-button fd-button--transparent" data-act="reject">Reject</button>
        </div>
        ${badges(meta)}
      </div>`, `approve${p.anomalous ? " approve--anomalous" : ""}`);

    el.querySelectorAll("button[data-act]").forEach((b) =>
      b.addEventListener("click", () => confirmAction(p.actionID, b.dataset.act === "approve", el)));
  }

  async function call(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
  }

  async function confirmAction(actionID, approve, cardEl) {
    cardEl.querySelectorAll("button").forEach((b) => (b.disabled = true));
    const { data } = await call("../../insights/confirmAction", { actionID, approve });
    if (data.status === "SUCCESS") {
      add(`<div class="fd-card__content"><div class="turn__role">Result</div>
           <div class="turn__body">${esc(data.answer)}</div></div>`);
    } else {
      add(`<div class="fd-card__content">
             <div class="fd-message-strip fd-message-strip--error">
               <span><span class="fd-message-strip__title">Refused.</span> ${esc(data.message)}
               ${data.errorCode ? `<code>${esc(data.errorCode)}</code>` : ""}</span>
             </div></div>`);
    }
    refreshUsage();
  }

  async function ask() {
    const question = qEl.value.trim();
    if (!question) { qEl.focus(); return; }

    askEl.disabled = true;
    askEl.innerHTML = '<span class="fd-busy"></span>Asking';
    add(`<div class="fd-card__content turn turn--me">
           <div class="turn__role">You</div><div class="turn__body">${esc(question)}</div></div>`, "");

    try {
      const { data } = await call("../../insights/ask", {
        question, warehouseID: whEl.value, channel: "Web",
        ...(conversationID && { conversationID }),
      });
      const meta = data.metadata || {};
      if (meta.conversationID) conversationID = meta.conversationID;

      if (data.status === "AWAITING_APPROVAL" && data.pendingAction) {
        renderApproval(data.pendingAction, meta);
      } else if (data.status === "RATE_LIMITED") {
        add(`<div class="fd-card__content">
               <div class="fd-message-strip fd-message-strip--warning">
                 <span><span class="fd-message-strip__title">Quota reached.</span> ${esc(data.message)}</span></div>
               ${badges(meta)}</div>`);
      } else if (data.status === "ERROR") {
        add(`<div class="fd-card__content">
               <div class="fd-message-strip fd-message-strip--error">
                 <span><span class="fd-message-strip__title">Could not answer.</span> ${esc(data.message)}
                 ${data.errorCode ? `<code>${esc(data.errorCode)}</code>` : ""}</span></div>
               ${badges(meta)}</div>`);
      } else {
        // Pipeline internals (rounds, tool calls) are already in the badges;
        // repeating them as tiles reads as "0 rounds, 0 tool calls" on a cache
        // hit — true, and useless. Only business numbers earn a tile.
        add(`<div class="fd-card__content">
               <div class="turn__role">FactoryPilot</div>
               <div class="turn__body">${esc(data.answer)}</div>
               ${badges(meta)}</div>`);
      }
    } catch (err) {
      add(`<div class="fd-card__content">
             <div class="fd-message-strip fd-message-strip--error">
               <span><span class="fd-message-strip__title">Service unreachable.</span> ${esc(err.message)}</span>
             </div></div>`);
    } finally {
      askEl.disabled = false;
      askEl.textContent = "Ask";
      qEl.value = "";
      refreshUsage();
    }
  }

  async function refreshUsage() {
    try {
      const res = await fetch("../../odata/token/myUsage()");
      if (!res.ok) return;
      const u = await res.json();
      $("usage").textContent = u.limitDay == null
        ? String(u.userID || "")
        : `${u.userID} · ${u.usedDay}/${u.limitDay} today`;
      $("initials").textContent = ((u.userID || "?")[0] || "?").toUpperCase();
    } catch { /* the usage chip is decoration; never block the page on it */ }
  }

  askEl.addEventListener("click", ask);
  qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  document.querySelectorAll("button[data-q]").forEach((c) =>
    c.addEventListener("click", () => { qEl.value = c.dataset.q; ask(); }));
  refreshUsage();
})();
</script>
</body>
</html>
