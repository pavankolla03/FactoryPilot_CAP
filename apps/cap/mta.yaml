_schema-version: '3.1'
ID: factorypilot
version: 0.1.0
description: FactoryPilot — AI-assisted S/4HANA insights on CAP

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
        # cds build does not carry app/ into the built module, so the Insights
        # chat, the admin launchpad and the Fiori apps would 404 in production.
        # fs.cpSync keeps this working on Windows build agents too.
        - node -e "require('fs').cpSync('app','gen/srv/app',{recursive:true})"

modules:
  # ---------------------------------------------------------------------------
  # The five CAP services. Also serves app/ — the Insights chat, the admin
  # launchpad and the four Fiori Elements apps — so there is no separate HTML5
  # repository to provision for this deployment shape.
  # ---------------------------------------------------------------------------
  - name: factorypilot-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: factorypilot-auth
      - name: factorypilot-db
      - name: factorypilot-redis

  # ---------------------------------------------------------------------------
  # Schema deployer. Runs once per deploy and exits — CAP owns the DDL, which
  # is why version4's infra/db/schema.sql is not carried over.
  # ---------------------------------------------------------------------------
  - name: factorypilot-db-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      memory: 512M
      tasks:
        - name: deploy-schema
          command: npm start
          memory: 512M
          disk-quota: 1024M
    build-parameters:
      builder: npm
    requires:
      - name: factorypilot-db

  # ---------------------------------------------------------------------------
  # SSO front door. Everything the browser touches goes through here.
  # ---------------------------------------------------------------------------
  - name: factorypilot-approuter
    type: nodejs
    path: app/router
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    requires:
      - name: factorypilot-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          # The approuter's default is 30s, which a question that has to call a
          # model and then S/4 can exceed — and when it does the user gets a
          # bare "HTTP 504" with no explanation and nothing in the audit log.
          # The service enforces its own shorter budget (ASK_BUDGET_MS, 75s) and
          # returns a real answer, so this only has to be the outer bound.
          timeout: 120000

resources:
  - name: factorypilot-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: factorypilot-${org}-${space}
        tenant-mode: dedicated

  # PostgreSQL, per the chosen db_engine. If this service is not entitled in
  # the subaccount, either switch to HANA Cloud (see the block below — the CDS
  # model is portable, only this resource and the deployer path change) or
  # register an external Postgres as a user-provided service with the same name.
  # Reuses the instance already provisioned in this space. Trial allows one
  # PostgreSQL instance, so declaring a managed-service here would ask for a
  # second and fail the whole deploy. `service-name` is the real instance;
  # `factorypilot-db` stays the name the modules bind to.
  - name: factorypilot-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: factorypilot-postgres

  # Answer cache. Optional by design: with no Redis bound the runtime falls back
  # to an in-process cache, which is correct for a single instance and simply
  # loses hit-rate across replicas. A client without a Redis entitlement can
  # still run the product.
  - name: factorypilot-redis
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: factorypilot-redis

  # --- HANA alternative -------------------------------------------------------
  # Replace factorypilot-db above with this, and point the deployer module at
  # gen/db instead of gen/pg:
  #
  # - name: factorypilot-db
  #   type: com.sap.xs.hdi-container
  #   parameters:
  #     service: hana
  #     service-plan: hdi-shared
